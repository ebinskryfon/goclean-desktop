<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />

    <link rel="canonical" href="https://github.com/ebinskryfon/goclean" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />

        var t = localStorage.getItem('goclean-theme');
